services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: donwiz
      POSTGRES_USER: donwiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [donwiz-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U donwiz"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://donwiz:${POSTGRES_PASSWORD:-change-me}@postgres:5432/donwiz
      NODE_ENV: production
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["4000:4000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  donwiz-db:
